<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Weddings — Solicitações de Operacional</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#b8965a;--gold-light:#d4af7a;--gold-pale:#fdf8f0;--gold-border:#f0e8d0;--white:#fff;--bg:#f7f4ef;--text:#1a1a1a;--muted:#888;--border:#e8e0d4;--red:#c0392b;--green:#2e7d32}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--white);border-bottom:1px solid var(--border);padding:20px 40px;display:flex;align-items:center;position:sticky;top:0;z-index:50}
.logo .w1{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--gold);letter-spacing:3px;text-transform:uppercase}
.logo .w2{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--text);letter-spacing:3px;text-transform:uppercase}
.logo .ws{font-size:9px;letter-spacing:2px;color:var(--muted);margin-top:2px;text-transform:uppercase}
.main{max-width:560px;margin:0 auto;padding:48px 24px}
.page{display:none}.page.active{display:block}
.form-header{display:flex;align-items:center;gap:12px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--gold-border)}
.form-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.form-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600}
.form-sub{font-size:12px;color:var(--muted);margin-top:2px}
.f{margin-bottom:16px}
.f label{display:block;font-size:11px;font-weight:700;color:#666;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.f input,.f select,.f textarea{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border .15s;background:#fff;color:var(--text)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold)}
.f textarea{resize:vertical;min-height:100px}
.urgencia-opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:4px}
.urg-opt{padding:14px 8px;border-radius:10px;border:1.5px solid var(--border);cursor:pointer;text-align:center;transition:all .15s;background:#fff}
.urg-opt .urg-icon{font-size:24px;margin-bottom:6px}
.urg-opt .urg-label{font-size:13px;font-weight:700;color:#888}
.urg-opt.sel-alta{border-color:#c0392b;background:#fdecea}
.urg-opt.sel-alta .urg-label{color:#c0392b}
.urg-opt.sel-media{border-color:#e65100;background:#fff3e0}
.urg-opt.sel-media .urg-label{color:#e65100}
.urg-opt.sel-baixa{border-color:#2e7d32;background:#e8f5e9}
.urg-opt.sel-baixa .urg-label{color:#2e7d32}
.btn-enviar{width:100%;padding:15px;border-radius:10px;background:var(--gold);color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px;transition:background .15s}
.btn-enviar:hover{background:var(--gold-light)}
.btn-enviar:disabled{opacity:.6;cursor:not-allowed}
.sucesso{text-align:center;padding:40px 20px}
.sucesso-icon{font-size:56px;margin-bottom:20px}
.sucesso-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:var(--gold);margin-bottom:10px}
.sucesso-sub{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:28px}
.btn-nova{background:none;border:1.5px solid var(--gold);color:var(--gold);padding:12px 28px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-nova:hover{background:var(--gold-pale)}
@media(max-width:480px){.header{padding:16px 20px}.main{padding:28px 16px}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="w1">Welcome</div>
    <div class="w2">Weddings</div>
    <div class="ws">Solicitações de Operacional</div>
  </div>
</div>

<div class="main">

  <div class="page active" id="page-form">
    <div class="form-header">
      <div class="form-icon" style="background:#fdf3e0">📋</div>
      <div>
        <div class="form-title">Solicitação de Operacional</div>
        <div class="form-sub">Preencha os dados e nossa equipe atenderá em breve</div>
      </div>
    </div>
    <div class="f"><label>Casamento</label>
      <select id="mari-casamento"><option value="">Selecionar casamento...</option></select>
    </div>
    <div class="f"><label>Nome do Convidado Solicitante</label>
      <input id="mari-nome" placeholder="Nome completo">
    </div>
    <div class="f"><label>Telefone / WhatsApp</label>
      <input id="mari-tel" placeholder="+55 (00) 00000-0000" type="tel">
    </div>
    <div class="f"><label>Solicitação</label>
      <textarea id="mari-sol" placeholder="Descreva o que precisa..."></textarea>
    </div>
    <div class="f">
      <label>Urgência</label>
      <div class="urgencia-opts">
        <div class="urg-opt" id="urg-alta" onclick="selUrgencia('alta')">
          <div class="urg-icon">🔴</div>
          <div class="urg-label">Alta</div>
        </div>
        <div class="urg-opt" id="urg-media" onclick="selUrgencia('media')">
          <div class="urg-icon">🟡</div>
          <div class="urg-label">Média</div>
        </div>
        <div class="urg-opt" id="urg-baixa" onclick="selUrgencia('baixa')">
          <div class="urg-icon">🟢</div>
          <div class="urg-label">Baixa</div>
        </div>
      </div>
    </div>
    <button class="btn-enviar" id="btn-mari" onclick="enviarMari()">Enviar Solicitação</button>
  </div>

  <div class="page" id="page-sucesso">
    <div class="sucesso">
      <div class="sucesso-icon">✅</div>
      <div class="sucesso-title">Solicitação enviada!</div>
      <div class="sucesso-sub">Recebemos sua solicitação e nossa equipe<br>entrará em contato em breve.</div>
      <button class="btn-nova" onclick="novaSolicitacao()">Fazer outra solicitação</button>
    </div>
  </div>

</div>

<script>
const{createClient}=supabase
const sb=createClient('https://yrnlfarricrhtfomwynd.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlybmxmYXJyaWNyaHRmb213eW5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczOTIxODksImV4cCI6MjA5Mjk2ODE4OX0.Ad4awFjQ9vcDqNyBbWycgv0rvpc3DOz4pPTi41nSp8w')

let urgenciaSel=''

function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}

function selUrgencia(v){
  urgenciaSel=v
  ;['alta','media','baixa'].forEach(u=>{document.getElementById('urg-'+u).className='urg-opt'+(v===u?' sel-'+u:'')})
}

function novaSolicitacao(){
  urgenciaSel=''
  ;['alta','media','baixa'].forEach(u=>document.getElementById('urg-'+u).className='urg-opt')
  ;['mari-casamento','mari-nome','mari-tel','mari-sol'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''})
  showPage('page-form')
}

async function carregarCasamentos(){
  const hoje=new Date().toISOString().split('T')[0]
  const{data}=await sb.from('casamentos').select('id,nome,plan_data').gte('plan_data',hoje).neq('status','Cancelado').order('plan_data',{ascending:true})
  const sel=document.getElementById('mari-casamento')
  if(sel)sel.innerHTML='<option value="">Selecionar casamento...</option>'+(data||[]).map(c=>`<option value="${c.id}" data-nome="${c.nome}">${c.nome}</option>`).join('')
}

async function enviarMari(){
  const btn=document.getElementById('btn-mari')
  const casEl=document.getElementById('mari-casamento')
  const casId=casEl?.value
  const casNome=casEl?.options[casEl.selectedIndex]?.dataset.nome||''
  const nome=document.getElementById('mari-nome').value.trim()
  const tel=document.getElementById('mari-tel').value.trim()
  const sol=document.getElementById('mari-sol').value.trim()
  if(!casId){alert('Selecione o casamento!');return}
  if(!nome){alert('Preencha o nome do convidado!');return}
  if(!sol){alert('Descreva a solicitação!');return}
  if(!urgenciaSel){alert('Selecione a urgência!');return}
  btn.textContent='Enviando...';btn.disabled=true
  const urgLabel={alta:'🔴 Alta',media:'🟡 Média',baixa:'🟢 Baixa'}[urgenciaSel]
  await sb.from('solicitacoes_kanban').insert({tipo:'operacional',coluna:'nova',responsavel:'mari',casamento_id:casId,casamento_nome:casNome,convidado_nome:nome,convidado_telefone:tel,solicitacao:sol,servicos:urgLabel})
  btn.textContent='Enviar Solicitação';btn.disabled=false
  showPage('page-sucesso')
}

carregarCasamentos()
</script>
</body>
</html>
